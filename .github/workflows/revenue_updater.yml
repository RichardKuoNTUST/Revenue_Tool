name: Revenue Updater

on:
  schedule:
    # 台灣時間 09:00 - 18:00 (週一~週五) 轉換為 UTC = 01:00 - 10:00
    - cron: '0 1-10 * * 1-5'
    # 台灣時間 12:00, 18:00 (週六~週日) 轉換為 UTC = 04:00, 10:00
    - cron: '0 4,10 * * 0,6'
  workflow_dispatch:
    # 允許手動觸發

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Revenue Scraper and Google Sheets Updater
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        # 如果是手動觸發，強制上傳 Google Sheets
        FORCE_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      run: |
        python main.py
